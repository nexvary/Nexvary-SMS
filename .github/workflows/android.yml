name: Android APK and checks
on:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests, Android lint and installable test APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Nexvary-SMS-1.0.0.apk
          sha256sum Nexvary-SMS-1.0.0.apk > Nexvary-SMS-1.0.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Nexvary-SMS-1.0.0-APK
          path: |
            Nexvary-SMS-1.0.0.apk
            Nexvary-SMS-1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
